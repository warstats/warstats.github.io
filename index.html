<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Clan Stats | Monet Style</title>
    <!-- Красивый шрифт с засечками для заголовков и чистый для текста -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* Палитра в стиле Моне: пастельный синий, пудровый розовый, лавандовый */
        :root { 
            --bg-gradient: linear-gradient(135deg, #e0eaff 0%, #f4e8ff 50%, #ffe6e6 100%);
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(255, 255, 255, 0.8);
            --accent: #7b9acc;
            --accent-dark: #5a78a6;
            --text-main: #2c3e50;
            --text-muted: #6a7c92;
            --gold: #d4af37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 20px; 
        }

        /* Эффект "картины" на фоне (размытые пятна) */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(160, 200, 255, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(255, 180, 200, 0.3) 0%, transparent 40%),
                        radial-gradient(circle at 50% 20%, rgba(200, 180, 255, 0.3) 0%, transparent 40%);
            z-index: -1;
            animation: floating 20s infinite alternate;
        }

        @keyframes floating {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(20px, 20px); }
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 10px 0; }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            font-weight: 800; 
            font-size: 32px; 
            color: var(--text-main);
            letter-spacing: 1px;
        }
        h1 i { color: var(--accent); margin-right: 10px; }

        .admin-btn { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            color: var(--text-main); 
            padding: 10px 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .admin-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Карточки с эффектом матового стекла */
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 24px; 
            padding: 30px; 
            margin-bottom: 30px; 
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 22px; 
            margin-bottom: 20px; 
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #uploadPanel { display: none; }
        
        .upload-area { 
            border: 2px dashed var(--accent); 
            border-radius: 20px; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            background: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .upload-area:hover { background: rgba(255,255,255,0.7); }
        .upload-area input[type="file"] { display: none; }

        button.btn-primary { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 50px; 
            font-weight: 600; 
            width: 100%; 
            margin-top: 20px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(123, 154, 204, 0.3);
        }
        button.btn-primary:hover { background: var(--accent-dark); }
        button.btn-primary:disabled { background: #ccc; cursor: wait; box-shadow: none; }

        #status { margin-top: 15px; font-size: 14px; color: var(--accent-dark); text-align: center; font-weight: 600; }

        /* Таблица */
        .table-responsive { overflow-x: auto; border-radius: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 12px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 15px; text-align: left; }
        th { 
            font-family: 'Playfair Display', serif;
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            font-size: 13px; 
            letter-spacing: 1px;
        }
        
        tr { transition: background 0.2s; }
        tr:hover { background: rgba(255,255,255,0.4); }
        
        .highlight { background: rgba(123, 154, 204, 0.15) !important; }
        
        .rank { font-family: 'Playfair Display', serif; font-weight: 800; color: var(--text-muted); }
        .rank.top-1 { color: var(--gold); font-size: 18px; }
        .rank.top-2 { color: #a0a0a0; font-size: 17px; }
        .rank.top-3 { color: #cda87e; font-size: 17px; }
        
        .name { font-weight: 600; color: var(--text-main); }
        .kd { font-weight: 800; color: var(--accent-dark); font-size: 16px; }

        @media (max-width: 600px) { 
            h1 { font-size: 24px; }
            .card { padding: 20px; }
            th, td { padding: 10px 5px; font-size: 12px; } 
            .name-col { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-leaf"></i> ARMS SHADOW</h1>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">
            <i class="fas fa-lock" id="lockIcon"></i> <span id="adminText">Админ</span>
        </button>
    </header>

    <div class="card" id="uploadPanel">
        <h2><i class="fas fa-feather-alt"></i> Загрузка скриншота</h2>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*">
            <i class="fas fa-image" style="font-size: 40px; color: var(--accent); margin-bottom: 15px;"></i>
            <p style="color: var(--text-muted);">Нажмите, чтобы выбрать картину...</p>
            <p style="font-size: 12px; color: #999; margin-top: 5px;">(Скриншот из игры)</p>
        </div>
        <button class="btn-primary" id="uploadBtn" onclick="uploadImage()">Распознать</button>
        <div id="status">Ожидание файла...</div>
    </div>

    <div class="card">
        <h2><i class="fas fa-chart-pie"></i> Статистика клана</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>#</th><th>Игрок</th><th>Матчи</th><th>У</th><th>С</th><th>K/D</th></tr>
                </thead>
                <tbody id="statsBody"><tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Загрузка данных...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas" style="display: none;"></canvas>

<script>
    const ADMIN_PASSWORD = "10293847Yy"; 
    const firebaseConfig = {
      apiKey: "AIzaSyAlpgpurJx8dEwBDWpkXSIjUYaUh-r7xNE",
      authDomain: "clanwars-arms.firebaseapp.com",
      projectId: "clanwars-arms",
      storageBucket: "clanwars-arms.firebasestorage.app",
      messagingSenderId: "636686968167",
      appId: "1:636686968167:web:e5cbfe652bd3cb41117bc2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    function updateAdminUI() {
        document.getElementById('uploadPanel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('adminBtn').className = isAdmin ? 'admin-btn active' : 'admin-btn';
        document.getElementById('lockIcon').className = isAdmin ? 'fas fa-unlock' : 'fas fa-lock';
        document.getElementById('adminText').innerText = isAdmin ? 'Выйти' : 'Войти как админ';
    }
    function toggleAdmin() {
        if (isAdmin) { isAdmin = false; localStorage.removeItem('isAdmin'); updateAdminUI(); } 
        else { if (prompt("Введите пароль:") === ADMIN_PASSWORD) { isAdmin = true; localStorage.setItem('isAdmin', 'true'); updateAdminUI(); } else alert("Неверный пароль"); }
    }
    window.addEventListener('DOMContentLoaded', updateAdminUI);

    db.collection('players').onSnapshot((snapshot) => {
        let players = [];
        snapshot.forEach(doc => { players.push(doc.data()); });
        const tbody = document.getElementById('statsBody');
        tbody.innerHTML = '';
        if (players.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Пока нет данных</td></tr>'; return; }
        
        players.sort((a, b) => b.avgKD - a.avgKD);
        
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            if (player.name.toLowerCase().includes('infern')) tr.classList.add('highlight');
            
            let rankClass = '';
            if (index === 0) rankClass = 'top-1';
            else if (index === 1) rankClass = 'top-2';
            else if (index === 2) rankClass = 'top-3';

            tr.innerHTML = `
                <td class="rank ${rankClass}">${index + 1}</td>
                <td class="name name-col">${player.name}</td>
                <td>${player.matches}</td>
                <td>${player.totalKills}</td>
                <td>${player.totalDeaths}</td>
                <td class="kd">${player.avgKD.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    });

    async function uploadImage() {
        if (!isAdmin) return;
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');
        
        if (!fileInput.files[0]) { status.innerText = "Выберите файл!"; return; }
        btn.disabled = true;
        status.innerText = "⏳ Обработка изображения...";

        try {
            const img = new Image();
            img.src = URL.createObjectURL(fileInput.files[0]);
            await new Promise(resolve => img.onload = resolve);

            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            const targetWidth = 1920;
            const scale = targetWidth / img.width;
            canvas.width = targetWidth;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const tableX = 660; 
            const tableY = 165; 
            const tableW = 1140; 
            const tableH = 880; 
            
            const rowHeight = tableH / 23;
            const players = [];

            // Список ников (так как мы используем пиксельный метод)
            const CLAN_ROSTER = [
                "MadgicCristal", "Dr_Piluka", "Alex_and_steave", "Infernitys", "FLINGG", "O_JDH_O",
                "MihaQO", "NikitaBulba", "Miha_beast", "lioKeVlar", "Timofeyku", "Jojo_zef",
                "Kir_Van", "TEMIH", "FurryDoter", "YetiLusuy", "Beryozka_", "Alpha_zero_six",
                "Muxaidig", "Bravo_zero_six", "Bulbashe", "ProduktCZ", "SKVIDI", "WWQ"
            ];

            for (let i = 0; i < 23; i++) {
                if (i >= CLAN_ROSTER.length) break;
                const rowY = tableY + (i * rowHeight);
                const currentName = CLAN_ROSTER[i];

                const killX = tableX + (tableW * 0.62);
                const deathX = tableX + (tableW * 0.69);
                
                const kills = readNumberFromArea(ctx, killX, rowY + (rowHeight/2) - 10, 60, 20);
                const deaths = readNumberFromArea(ctx, deathX, rowY + (rowHeight/2) - 10, 60, 20);

                if (kills !== null && deaths !== null) {
                    players.push({ name: currentName, kills, deaths });
                }
            }

            if (players.length === 0) { 
                status.innerText = "❌ Не удалось прочитать цифры."; 
                btn.disabled = false; 
                return; 
            }

            status.innerText = `📤 Сохранение...`;
            const batch = db.batch();
            for (const p of players) {
                const safeName = p.name.replace(/\//g, '_');
                const playerRef = db.collection('players').doc(safeName);
                const doc = await playerRef.get();
                
                if (doc.exists) {
                    const data = doc.data();
                    batch.update(playerRef, {
                        matches: data.matches + 1,
                        totalKills: data.totalKills + p.kills,
                        totalDeaths: data.totalDeaths + p.deaths,
                        avgKD: (data.totalKills + p.kills) / (data.totalDeaths + p.deaths || 1)
                    });
                } else {
                    batch.set(playerRef, {
                        name: p.name, matches: 1, totalKills: p.kills, totalDeaths: p.deaths,
                        avgKD: p.kills / (p.deaths || 1)
                    });
                }
            }
            await batch.commit();
            status.innerText = `✅ Успешно!`;
            fileInput.value = '';

        } catch (e) {
            console.error(e);
            status.innerText = "❌ Ошибка: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }

    function readNumberFromArea(ctx, x, y, w, h) {
        try {
            const imgData = ctx.getImageData(x, y, w, h);
            const data = imgData.data;
            let whitePixels = 0;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 150 && data[i+1] > 150 && data[i+2] > 150) whitePixels++;
            }
            if (whitePixels < 10) return 0; 
            if (whitePixels < 50) return Math.round(whitePixels / 20) * 5;
            if (whitePixels < 100) return Math.round(whitePixels / 30) * 10;
            return Math.min(99, Math.round(whitePixels / 4));
        } catch(e) { return null; }
    }
</script>
</body>
</html>
