<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Clan Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #0f111a; --card-bg: #1a1d2d; --accent: #00d2ff; --text-main: #fff; --text-muted: #8b92a5; --border: #2a2e42; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-weight: 800; font-size: 24px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .admin-btn.active { color: var(--accent); border-color: var(--accent); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        #uploadPanel { display: none; }
        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; }
        button.btn-primary { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; width: 100%; margin-top: 15px; cursor: pointer; }
        #status { margin-top: 15px; font-size: 14px; color: #ffaa00; text-align: center; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .kd { font-weight: 800; color: var(--accent); }
        .highlight { background: rgba(0, 210, 255, 0.1) !important; }
        @media (max-width: 600px) { th, td { padding: 10px 5px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-trophy" style="color: var(--accent);"></i> ARMS SHADOW</h1>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">
            <i class="fas fa-lock" id="lockIcon"></i> <span id="adminText">Админ</span>
        </button>
    </header>

    <div class="card" id="uploadPanel">
        <h2><i class="fas fa-cloud-upload-alt"></i> Загрузка скриншота</h2>
        <div class="upload-area">
            <input type="file" id="fileInput" accept="image/*">
            <i class="fas fa-image" style="font-size: 30px; color: var(--accent);"></i>
            <p>Нажмите, чтобы выбрать скриншот</p>
        </div>
        <button class="btn-primary" id="uploadBtn" onclick="uploadImage()">Распознать и добавить</button>
        <div id="status">Ожидание файла...</div>
    </div>

    <div class="card">
        <h2><i class="fas fa-chart-line" style="color: var(--accent);"></i> Статистика клана</h2>
        <div class="table-responsive">
            <table>
                <thead><tr><th>#</th><th>Игрок</th><th>Матчи</th><th>У</th><th>С</th><th>K/D</th></tr></thead>
                <tbody id="statsBody"><tr><td colspan="6" style="text-align:center;">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas" style="display: none;"></canvas>
<canvas id="debugCanvas" style="display: none;"></canvas> <!-- Для отладки -->

<script>
    const ADMIN_PASSWORD = "10293847Yy"; 
    const firebaseConfig = {
      apiKey: "AIzaSyAlpgpurJx8dEwBDWpkXSIjUYaUh-r7xNE",
      authDomain: "clanwars-arms.firebaseapp.com",
      projectId: "clanwars-arms",
      storageBucket: "clanwars-arms.firebasestorage.app",
      messagingSenderId: "636686968167",
      appId: "1:636686968167:web:e5cbfe652bd3cb41117bc2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    function updateAdminUI() {
        document.getElementById('uploadPanel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('adminBtn').className = isAdmin ? 'admin-btn active' : 'admin-btn';
        document.getElementById('lockIcon').className = isAdmin ? 'fas fa-unlock' : 'fas fa-lock';
        document.getElementById('adminText').innerText = isAdmin ? 'Выйти' : 'Админ';
    }
    function toggleAdmin() {
        if (isAdmin) { isAdmin = false; localStorage.removeItem('isAdmin'); updateAdminUI(); } 
        else { if (prompt("Пароль:") === ADMIN_PASSWORD) { isAdmin = true; localStorage.setItem('isAdmin', 'true'); updateAdminUI(); } else alert("Неверный пароль"); }
    }
    window.addEventListener('DOMContentLoaded', updateAdminUI);

    db.collection('players').onSnapshot((snapshot) => {
        let players = [];
        snapshot.forEach(doc => { players.push(doc.data()); });
        const tbody = document.getElementById('statsBody');
        tbody.innerHTML = '';
        if (players.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет данных</td></tr>'; return; }
        players.sort((a, b) => b.avgKD - a.avgKD);
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            if (player.name.toLowerCase().includes('infern')) tr.classList.add('highlight');
            tr.innerHTML = `<td>${index + 1}</td><td>${player.name}</td><td>${player.matches}</td><td>${player.totalKills}</td><td>${player.totalDeaths}</td><td class="kd">${player.avgKD.toFixed(2)}</td>`;
            tbody.appendChild(tr);
        });
    });

    // ==========================================
    // УМНАЯ ОБРЕЗКА И РАСПОЗНАВАНИЕ
    // ==========================================
    async function uploadImage() {
        if (!isAdmin) return;
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');
        
        if (!fileInput.files[0]) { status.innerText = "Выберите файл!"; return; }
        btn.disabled = true;
        status.innerText = "⏳ Анализ пикселей (поиск таблицы)...";

        try {
            const img = new Image();
            img.src = URL.createObjectURL(fileInput.files[0]);
            await new Promise(resolve => img.onload = resolve);

            // Масштабируем до ширины 1920 для единообразия координат
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            const targetWidth = 1920;
            const scale = targetWidth / img.width;
            canvas.width = targetWidth;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // --- УМНЫЙ ПОИСК ТАБЛИЦЫ ПО ПИКСЕЛЯМ ---
            // Ищем темно-серый прямоугольник таблицы в левой части экрана
            // Сканируем строку Y=200 (там обычно начинается шапка таблицы)
            let tableStartX = 0;
            let tableStartY = 0;
            const scanY = 200; // Примерная высота шапки таблицы
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Ищем границу таблицы (где начинается темный фон)
            // Проходим по пикселям и ищем резкий переход цвета
            for (let x = 100; x < canvas.width / 2; x++) {
                const i = (scanY * canvas.width + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2];
                // Если цвет стал темно-серым (цвет фона таблицы)
                if (r < 50 && g < 50 && b < 60) {
                    tableStartX = x;
                    break;
                }
            }

            // Если не нашли, берем стандартное значение
            if (tableStartX === 0) tableStartX = 640;
            
            // Верх таблицы ищем чуть выше (примерно 150 пикселей от верха)
            tableStartY = 150;

            // Размеры таблицы (подобрано под 1920px)
            const tableWidth = 1280;
            const tableHeight = 880;

            // Вырезаем область таблицы
            const tableImgData = ctx.getImageData(tableStartX, tableStartY, tableWidth, tableHeight);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = tableWidth;
            tempCanvas.height = tableHeight;
            tempCanvas.getContext('2d').putImageData(tableImgData, 0, 0);

            // --- ОТЛАДКА: Показываем вырезанную область (раскомментируйте, если нужно посмотреть) ---
            // document.body.appendChild(tempCanvas); 
            // tempCanvas.style.display = 'block';

            status.innerText = "⏳ Нейросеть читает вырезанную область...";
            
            const worker = await Tesseract.createWorker('rus+eng');
            await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK });
            
            // Отправляем на распознавание ТОЛЬКО ВЫРЕЗАННУЮ ЧАСТЬ
            const ret = await worker.recognize(tempCanvas);
            await worker.terminate();

            // Парсинг
            const lines = ret.data.text.split('\n');
            const players = [];

            // Улучшенная регулярка: ищет строку, где после места и ника идут 3 числа подряд
            // Пример: "1 MadgicCristal 35 19 10 31310..."
            const rowRegex = /^(\d{1,2})\s+([A-Za-z0-9_\-\|\sа-яА-Я]+?)\s+(\d{1,2})\s+(\d{1,2})\s+(\d{1,2})\s+/;

            lines.forEach(line => {
                const cleanLine = line.trim();
                const match = cleanLine.match(rowRegex);
                if (match) {
                    const name = match[2].trim();
                    const kills = parseInt(match[3]);
                    const deaths = parseInt(match[4]);
                    
                    // Фильтр мусора (если имя слишком короткое или цифры странные)
                    if (name.length > 2 && kills < 100) {
                        players.push({ name, kills, deaths });
                    }
                }
            });

            if (players.length === 0) { 
                status.innerText = "❌ Не удалось найти таблицу. Проверьте, что скриншот сделан полностью (не обрезан)."; 
                btn.disabled = false; 
                return; 
            }

            status.innerText = `📤 Сохранение ${players.length} игроков...`;
            const batch = db.batch();
            for (const p of players) {
                const safeName = p.name.replace(/\//g, '_');
                const playerRef = db.collection('players').doc(safeName);
                const doc = await playerRef.get();
                
                if (doc.exists) {
                    const data = doc.data();
                    batch.update(playerRef, {
                        matches: data.matches + 1,
                        totalKills: data.totalKills + p.kills,
                        totalDeaths: data.totalDeaths + p.deaths,
                        avgKD: (data.totalKills + p.kills) / (data.totalDeaths + p.deaths || 1)
                    });
                } else {
                    batch.set(playerRef, {
                        name: p.name, matches: 1, totalKills: p.kills, totalDeaths: p.deaths,
                        avgKD: p.kills / (p.deaths || 1)
                    });
                }
            }
            await batch.commit();
            status.innerText = `✅ Успешно добавлено!`;
            fileInput.value = '';

        } catch (e) {
            console.error(e);
            status.innerText = "❌ Ошибка: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
