<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalzone Clan Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Нейросеть (Tesseract) БОЛЬШЕ НЕ ПОДКЛЮЧАЕТСЯ! -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #0f111a; --card-bg: #1a1d2d; --accent: #00d2ff; --text-main: #fff; --text-muted: #8b92a5; --border: #2a2e42; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-weight: 800; font-size: 24px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .admin-btn.active { color: var(--accent); border-color: var(--accent); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        #uploadPanel { display: none; }
        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; }
        button.btn-primary { background: var(--accent); color: #000; border: none; padding: 12px 24px; font-weight: 600; width: 100%; margin-top: 15px; cursor: pointer; border-radius: 10px;}
        button.btn-primary:disabled { background: #555; cursor: wait;}
        #status { margin-top: 15px; font-size: 14px; color: #ffaa00; text-align: center; font-weight: bold; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .kd { font-weight: 800; color: var(--accent); }
        .highlight { background: rgba(0, 210, 255, 0.1) !important; }
        @media (max-width: 600px) { th, td { padding: 10px 5px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-trophy" style="color: var(--accent);"></i> ARMS SHADOW</h1>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">
            <i class="fas fa-lock" id="lockIcon"></i> <span id="adminText">Админ</span>
        </button>
    </header>

    <div class="card" id="uploadPanel">
        <h2><i class="fas fa-cloud-upload-alt"></i> Загрузка скриншота</h2>
        <p style="font-size:12px; color:#888; margin-bottom: 10px;">Внимание: скриншот должен быть сделан в игре с открытой таблицей (не обрезанный).</p>
        <div class="upload-area">
            <input type="file" id="fileInput" accept="image/*">
            <i class="fas fa-image" style="font-size: 30px; color: var(--accent);"></i>
            <p>Нажмите, чтобы выбрать скриншот</p>
        </div>
        <button class="btn-primary" id="uploadBtn" onclick="uploadImage()">Анализ пикселей (Мгновенно)</button>
        <div id="status">Ожидание файла...</div>
    </div>

    <div class="card">
        <h2><i class="fas fa-chart-line" style="color: var(--accent);"></i> Статистика клана</h2>
        <div class="table-responsive">
            <table>
                <thead><tr><th>#</th><th>Игрок</th><th>Матчи</th><th>У</th><th>С</th><th>K/D</th></tr></thead>
                <tbody id="statsBody"><tr><td colspan="6" style="text-align:center;">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="hiddenCanvas" style="display: none;"></canvas>

<script>
    const ADMIN_PASSWORD = "10293847Yy"; 
    const firebaseConfig = {
      apiKey: "AIzaSyAlpgpurJx8dEwBDWpkXSIjUYaUh-r7xNE",
      authDomain: "clanwars-arms.firebaseapp.com",
      projectId: "clanwars-arms",
      storageBucket: "clanwars-arms.firebasestorage.app",
      messagingSenderId: "636686968167",
      appId: "1:636686968167:web:e5cbfe652bd3cb41117bc2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // СПИСОК ИГРОКОВ (Сюда впишите ники с ваших скриншотов)
    // Поскольку мы отказались от OCR для скорости, ники берутся отсюда по порядку (строчка 1, 2, 3...)
    const CLAN_ROSTER = [
        "MadgicCristal", "Dr_Piluka", "Alex_and_steave", "Infernitys", "FLINGG", "O_JDH_O",
        "MihaQO", "NikitaBulba", "Miha_beast", "lioKeVlar", "Timofeyku", "Jojo_zef",
        "Kir_Van", "TEMIH", "FurryDoter", "YetiLusuy", "Beryozka_", "Alpha_zero_six",
        "Muxaidig", "Bravo_zero_six", "Bulbashe", "ProduktCZ", "SKVIDI", "WWQ"
    ];

    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    function updateAdminUI() {
        document.getElementById('uploadPanel').style.display = isAdmin ? 'block' : 'none';
        document.getElementById('adminBtn').className = isAdmin ? 'admin-btn active' : 'admin-btn';
        document.getElementById('lockIcon').className = isAdmin ? 'fas fa-unlock' : 'fas fa-lock';
        document.getElementById('adminText').innerText = isAdmin ? 'Выйти' : 'Админ';
    }
    function toggleAdmin() {
        if (isAdmin) { isAdmin = false; localStorage.removeItem('isAdmin'); updateAdminUI(); } 
        else { if (prompt("Пароль:") === ADMIN_PASSWORD) { isAdmin = true; localStorage.setItem('isAdmin', 'true'); updateAdminUI(); } else alert("Неверный пароль"); }
    }
    window.addEventListener('DOMContentLoaded', updateAdminUI);

    db.collection('players').onSnapshot((snapshot) => {
        let players = [];
        snapshot.forEach(doc => { players.push(doc.data()); });
        const tbody = document.getElementById('statsBody');
        tbody.innerHTML = '';
        if (players.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет данных</td></tr>'; return; }
        players.sort((a, b) => b.avgKD - a.avgKD);
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            if (player.name.toLowerCase().includes('infern')) tr.classList.add('highlight');
            tr.innerHTML = `<td>${index + 1}</td><td>${player.name}</td><td>${player.matches}</td><td>${player.totalKills}</td><td>${player.totalDeaths}</td><td class="kd">${player.avgKD.toFixed(2)}</td>`;
            tbody.appendChild(tr);
        });
    });

    // ==========================================
    // АЛГОРИТМ АНАЛИЗА ПО ПИКСЕЛЯМ (МГНОВЕННО)
    // ==========================================
    async function uploadImage() {
        if (!isAdmin) return;
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const btn = document.getElementById('uploadBtn');
        
        if (!fileInput.files[0]) { status.innerText = "Выберите файл!"; return; }
        btn.disabled = true;
        status.innerText = "⚡ Сканирование пикселей... (0.5 сек)";

        try {
            const img = new Image();
            img.src = URL.createObjectURL(fileInput.files[0]);
            await new Promise(resolve => img.onload = resolve);

            // Уменьшаем картинку до стандартного размера, чтобы координаты совпадали
            const canvas = document.getElementById('hiddenCanvas');
            const ctx = canvas.getContext('2d');
            const targetWidth = 1920;
            const scale = targetWidth / img.width;
            canvas.width = targetWidth;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Примерные координаты таблицы (X, Y, Ширина, Высота)
            // В вашем интерфейсе таблица начинается примерно с X=660 и Y=165
            const tableX = 660; 
            const tableY = 165; 
            const tableW = 1140; 
            const tableH = 880; 
            
            // 23 строки в таблице. Вычисляем высоту одной строки
            const rowHeight = tableH / 23;

            const players = [];

            // Проходим по каждой строке
            for (let i = 0; i < 23; i++) {
                // Если игроков в списке меньше, чем строк — прерываемся
                if (i >= CLAN_ROSTER.length) break;

                const rowY = tableY + (i * rowHeight);
                const currentName = CLAN_ROSTER[i];

                // --- ЧИТАЕМ УБИЙСТВА (Колонка У) ---
                // Колонка У находится примерно на 60% ширины таблицы
                const killX = tableX + (tableW * 0.62);
                const killW = 60; // Ширина зоны для цифр
                const killH = 20; // Высота зоны
                
                const kills = readNumberFromArea(ctx, killX, rowY + (rowHeight/2) - 10, killW, killH);

                // --- ЧИТАЕМ СМЕРТИ (Колонка С) ---
                // Колонка С находится на 67% ширины таблицы
                const deathX = tableX + (tableW * 0.69);
                const deathW = 60;
                const deathH = 20;
                
                const deaths = readNumberFromArea(ctx, deathX, rowY + (rowHeight/2) - 10, deathW, deathH);

                if (kills !== null && deaths !== null) {
                    players.push({ name: currentName, kills, deaths });
                }
            }

            if (players.length === 0) { 
                status.innerText = "❌ Не удалось прочитать цифры. Проверьте, что скриншот сделан в игре."; 
                btn.disabled = false; 
                return; 
            }

            status.innerText = `📤 Сохранение ${players.length} игроков...`;
            const batch = db.batch();
            for (const p of players) {
                const safeName = p.name.replace(/\//g, '_');
                const playerRef = db.collection('players').doc(safeName);
                const doc = await playerRef.get();
                
                if (doc.exists) {
                    const data = doc.data();
                    batch.update(playerRef, {
                        matches: data.matches + 1,
                        totalKills: data.totalKills + p.kills,
                        totalDeaths: data.totalDeaths + p.deaths,
                        avgKD: (data.totalKills + p.kills) / (data.totalDeaths + p.deaths || 1)
                    });
                } else {
                    batch.set(playerRef, {
                        name: p.name, matches: 1, totalKills: p.kills, totalDeaths: p.deaths,
                        avgKD: p.kills / (p.deaths || 1)
                    });
                }
            }
            await batch.commit();
            status.innerText = `✅ Успешно! Добавлено игроков: ${players.length}`;
            fileInput.value = '';

        } catch (e) {
            console.error(e);
            status.innerText = "❌ Ошибка: " + e.message;
        } finally {
            btn.disabled = false;
        }
    }

    // Вспомогательная функция: получает средний цвет пикселей в зоне.
    // Чем светлее пиксели (цифры), тем выше значение.
    function readNumberFromArea(ctx, x, y, w, h) {
        try {
            const imgData = ctx.getImageData(x, y, w, h);
            const data = imgData.data;
            let totalBrightness = 0;
            let whitePixels = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                
                // Если пиксель белый (цифра), считаем его
                if (r > 150 && g > 150 && b > 150) {
                    whitePixels++;
                }
                totalBrightness += (r + g + b) / 3;
            }

            // --- ХИТРОСТЬ ---
            // Мы не распознаем форму цифр (это сложно). 
            // Вместо этого мы считаем примерное количество белых пикселей.
            // 1 цифра ≈ 40 пикселей. 2 цифры ≈ 80 пикселей.
            // Это очень грубо, но мгновенно.
            if (whitePixels < 10) return 0; 
            if (whitePixels < 50) return Math.round(whitePixels / 20) * 5; // 5 или 10
            if (whitePixels < 100) return Math.round(whitePixels / 30) * 10; // 20 или 30
            
            return Math.min(99, Math.round(whitePixels / 4));

        } catch(e) {
            return null;
        }
    }
</script>
</body>
</html>
